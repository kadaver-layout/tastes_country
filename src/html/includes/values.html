<section class="values">
  <div class="container">
    <div class="values__intro">
      <h2 class="section-title values__title">{{ values.title }}</h2>
      <p class="lead values__lead">{{ values.lead }}</p>
      <p class="lead values__lead">{{ values.lead2 }}</p>
    </div>
    <div class="values__board">
      <ul class="values__list">
        {% for card in values.cards %}
        <li class="values__card values__card--{{ card.modifier }}">
          <h3 class="values__card-title">{{ card.title }}</h3>
          <p class="values__card-text">{{ card.text }}</p>
        </li>
        {% endfor %}
      </ul>
      <img class="values__sticker values__sticker--craft" src="assets/img/sticker-craft.webp" alt="" width="178" height="142">
      <img class="values__sticker values__sticker--family" src="assets/img/sticker-family-farms.webp" alt="" width="222" height="142">
    </div>
  </div>
</section>
