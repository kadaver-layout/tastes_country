<section class="videos">
  <div class="container videos__intro">
    <h2 class="section-title videos__title">{{ videos.title }}</h2>
    <p class="lead videos__lead">{{ videos.lead }}</p>
    {% if videos.lead2 %}<p class="lead videos__lead">{{ videos.lead2 }}</p>{% endif %}
  </div>
  <div class="videos__rail" data-rail>
    <ul class="videos__list" data-rail-track>
      {% for card in videos.cards %}
      <li class="videos__item">
        <button class="video-card" type="button" data-reel-toggle aria-label="Видео о ярмарке{% if card.city %}, {{ card.city }}{% endif %}">
          <video class="video-card__media" src="assets/video/fair-reel.mp4" poster="assets/img/{{ card.poster }}.webp" muted loop playsinline preload="metadata" tabindex="-1"></video>
          <span class="chip video-card__city">{{ card.city | default(videos.unknownCity) }}</span>
        </button>
      </li>
      {% endfor %}
    </ul>
    <div class="rail-nav videos__nav">
      <button class="rail-button" type="button" data-rail-prev aria-label="Предыдущие видео">
        <img src="assets/img/arrow-left.svg" alt="">
      </button>
      <button class="rail-button" type="button" data-rail-next aria-label="Следующие видео">
        <img src="assets/img/arrow-right.svg" alt="">
      </button>
    </div>
  </div>
  <img class="videos__sticker videos__sticker--100" src="assets/img/sticker-100.svg" alt="" width="260" height="153">
  <img class="videos__sticker videos__sticker--local" src="assets/img/sticker-local-manufacturers.png" alt="" width="230" height="145">
</section>
