<section class="categories" id="categories">
  <div class="container">
    {% if categoriesIntroVisible %}
    <div class="categories__intro">
      <h2 class="section-title categories__title">{{ categoriesIntro.title }}</h2>
      <p class="lead categories__lead">{{ categoriesIntro.lead }}</p>
    </div>
    {% endif %}
    <ul class="categories__list">
      {% for category in categories %}
      <li class="categories__item">
        <a class="category-card" href="{{ category.url }}">
          <h3 class="card-title category-card__title">{{ category.title }}</h3>
          <img class="category-card__photo" src="assets/img/{{ category.photo }}.webp" alt="">
        </a>
      </li>
      {% endfor %}
    </ul>
  </div>
</section>
