<section class="coverage">
  <div class="container coverage__container">
    <div class="coverage__intro">
      <h2 class="section-title coverage__title">{{ coverage.title }}</h2>
      <p class="lead coverage__lead">{{ coverage.lead }}</p>
      <p class="coverage__stat">{{ coverage.stat }}</p>
      <button class="button button--lime coverage__button" type="button" data-open-dialog="city-dialog">{{ coverage.button }}</button>
    </div>
    <img class="coverage__map" src="assets/img/coverage-map.svg" alt="Карта России с городами, где проходят ярмарки «Вкусы страны»">
  </div>
</section>
