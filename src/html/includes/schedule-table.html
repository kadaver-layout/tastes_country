<section class="schedule">
  <div class="container">
    <h2 class="section-title schedule__title">{{ schedule.title }}</h2>
    <div class="schedule__card" id="schedule-overview">
      <div class="schedule__header">
        <p class="schedule__month" data-week-label></p>
        <ul class="schedule__days" data-week-days></ul>
      </div>
      <ul class="schedule__rows" data-week-rows style="--today: -1"></ul>
      <div class="rail-nav schedule__nav">
        <button class="rail-button" type="button" data-week-prev aria-label="Предыдущая неделя" aria-controls="schedule-overview" disabled>
          <img src="assets/img/arrow-left.svg" alt="">
        </button>
        <button class="rail-button" type="button" data-week-next aria-label="Следующая неделя" aria-controls="schedule-overview">
          <img src="assets/img/arrow-right.svg" alt="">
        </button>
      </div>
      <p class="visually-hidden" role="status" aria-live="polite" data-week-status></p>
    </div>
  </div>
  <script type="application/json" id="schedule-weeks">{{ schedule.weeks | dump | safe }}</script>
</section>
