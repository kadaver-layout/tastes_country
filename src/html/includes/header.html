<header class="header">
  <div class="container header__container">
    <div class="header__brand">
      <a class="header__logo" href="index.html" aria-label="Вкусы страны — на главную">
        <img src="assets/img/logo-header.svg" alt="" width="152" height="70">
      </a>
      <button class="header__city" type="button" data-open-dialog="city-dialog" aria-haspopup="dialog">
        <span data-current-city>{{ site.city }}</span>
        <img src="assets/img/chevron-down.svg" alt="" width="24" height="24">
      </button>
    </div>
    <nav class="header__nav" aria-label="Основная навигация">
      <ul class="header__nav-list">
        {% for item in nav %}
        <li><a class="header__nav-link" href="{{ item.url }}">{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    <a class="header__phone button button--cream" href="{{ site.phoneHref }}">{{ site.phone }}</a>
    <button class="header__burger" type="button" data-open-dialog="mobile-menu" aria-haspopup="dialog" aria-label="Открыть меню">
      <img src="assets/img/burger.svg" alt="" width="16" height="12">
    </button>
  </div>
</header>
