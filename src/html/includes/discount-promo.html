<section class="promo">
  <div class="container promo__container">
    <img class="promo__pattern" src="assets/img/promo-pattern.svg" alt="" aria-hidden="true">
    <div class="promo__content">
      <h2 class="section-title promo__title">{{ promo.title }}</h2>
      <p class="lead promo__lead">{{ promo.lead }}</p>
      <button class="button button--lime promo__button" type="button" data-open-dialog="discount-dialog">{{ promo.button }}</button>
    </div>
    <img class="promo__sticker promo__sticker--discount" src="assets/img/sticker-discount-10.svg" alt="" width="190" height="116">
    <img class="promo__sticker promo__sticker--promocode" src="assets/img/sticker-promocode.svg" alt="" width="320" height="102">
  </div>
</section>
